<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Z-Stream Discord Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #stream {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #fff;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;

            padding: 8px 12px;
            border-radius: 7px;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div id="status">
    Starting...
</div>

<iframe
    id="stream"
    title="Z-Stream"
    allow="
        autoplay;
        encrypted-media;
        fullscreen;
        picture-in-picture
    "
    allowfullscreen>
</iframe>

<script>
    "use strict";

    const CLIENT_ID =
        "1535467669854359623";

    const DIRECT_URL =
        "https://zstream.mov/";

    const PROXY_URL =
        `https://${CLIENT_ID}.discordsays.com/zstream/`;

    const iframe =
        document.getElementById("stream");

    const status =
        document.getElementById("status");


    /*
     * Discord embeds Activities inside an iframe.
     *
     * Normal browser:
     *     GitHub Pages → zstream.mov
     *
     * Discord:
     *     Discord → Activity → Discord proxy → zstream.mov
     */

    const insideDiscord =
        window.parent !== window;


    if (insideDiscord) {

        status.textContent =
            "Discord detected — loading Z-Stream through URL Mapping";

        iframe.src =
            PROXY_URL;

        console.log(
            "[Z-Stream] Proxy:",
            PROXY_URL
        );

    } else {

        status.textContent =
            "Browser detected — loading Z-Stream directly";

        iframe.src =
            DIRECT_URL;

        console.log(
            "[Z-Stream] Direct:",
            DIRECT_URL
        );
    }


    /*
     * iframe load
     */

    iframe.addEventListener(
        "load",
        () => {

            status.textContent =
                "Z-Stream iframe loaded";

            console.log(
                "[Z-Stream] iframe load event fired"
            );

            setTimeout(() => {

                status.textContent =
                    "Z-Stream loaded";

            }, 2000);
        }
    );


    /*
     * iframe error
     */

    iframe.addEventListener(
        "error",
        (event) => {

            status.textContent =
                "Z-Stream iframe error";

            console.error(
                "[Z-Stream] iframe error:",
                event
            );
        }
    );


    /*
     * Global errors
     */

    window.addEventListener(
        "error",
        event => {

            console.error(
                "[Activity Error]",
                event.message,
                event.filename,
                event.lineno
            );
        }
    );


    window.addEventListener(
        "unhandledrejection",
        event => {

            console.error(
                "[Promise Error]",
                event.reason
            );
        }
    );
</script>

</body>
</html>
