<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinejoy Activity</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            width: min(500px, 90%);
            text-align: center;
            color: white;
        }

        .message h1 {
            margin-bottom: 12px;
        }

        .message p {
            color: #aaa;
            line-height: 1.5;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #777;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div id="app">
    <div class="message">
        <h1>Cinejoy</h1>

        <p>
            Cinejoy currently does not allow external websites
            to embed it inside an iframe.
        </p>

        <button id="openCinejoy">
            Open Cinejoy
        </button>
    </div>
</div>

<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.4.1/dist/discord-embedded-app-sdk.js"></script>

<script>
    "use strict";

    const CLIENT_ID = "1535467669854359623";
    const CINEJOY_URL = "https://cinejoy.to/";

    const status = document.getElementById("status");
    const openButton = document.getElementById("openCinejoy");

    openButton.addEventListener("click", () => {
        window.open(CINEJOY_URL, "_blank", "noopener,noreferrer");
    });

    async function initializeDiscord() {
        if (!window.DiscordSDK) {
            status.textContent = "Running outside Discord";
            return;
        }

        try {
            const discordSdk = new DiscordSDK(CLIENT_ID);

            await discordSdk.ready();

            window.discordSdk = discordSdk;

            status.textContent = "Discord Activity connected";

            console.log("Discord SDK ready!");
        } catch (error) {
            console.error(
                "Discord SDK initialization failed:",
                error
            );

            status.textContent = "Discord SDK unavailable";
        }
    }

    initializeDiscord();
</script>

</body>
</html>
