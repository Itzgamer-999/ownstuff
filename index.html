<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinema Test</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;

            padding: 8px 12px;
            border-radius: 6px;

            background: rgba(0, 0, 0, .8);
            color: white;

            font: 12px Arial;
        }
    </style>
</head>

<body>

<div id="status">Loading Kinema...</div>

<iframe
    id="kinema"
    src="https://1535334391478358127.discordsays.com/"
    allow="
        autoplay;
        encrypted-media;
        fullscreen;
        picture-in-picture
    "
    allowfullscreen>
</iframe>

<script>
    const iframe = document.getElementById("kinema");
    const status = document.getElementById("status");

    iframe.addEventListener("load", () => {
        console.log("[Kinema] iframe loaded");
        status.textContent = "Kinema iframe loaded";

        setTimeout(() => {
            status.style.display = "none";
        }, 2000);
    });

    iframe.addEventListener("error", (event) => {
        console.error("[Kinema] iframe error:", event);
        status.textContent = "Kinema iframe error";
    });
</script>

</body>
</html>
